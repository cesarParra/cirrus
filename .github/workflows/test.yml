name: CI

# Every pull request, and every push to main. A pull request nothing checks before it merges is a
# pull request whose first real test is a release build.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install Dart dependencies
        run: dart pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      # --fatal-infos, so the lints in analysis_options.yaml are a gate rather than a suggestion.
      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Run Dart tests
        run: dart test

      # Cirrus ships as a compiled binary, so compiling is part of what a change has to keep
      # working - and nothing above compiles anything.
      - name: Compile the binary
        run: dart compile exe bin/cirrus.dart -o cirrus

      # What the unit tests cannot see. They drive cirrus through a CliRunner double, so nothing
      # above runs the real binary, reads a config file off disk, or observes an exit status -
      # which is most of what a user's first minute consists of.
      - name: Smoke test the binary
        run: |
          set -euo pipefail
          binary="$PWD/cirrus"
          workspace="$(mktemp -d)"
          cd "$workspace"

          # Written out rather than `! cirrus ...`: `set -e` deliberately ignores a command whose
          # status is inverted, so `! cirrus run boom` passes whatever cirrus does - which is the
          # exact defect this step exists to catch. The output is kept so that what cirrus said can
          # be asserted too.
          exits_non_zero() {
            if "$@" > last.log 2>&1; then
              echo "Expected '$*' to exit non-zero. It exited 0." >&2
              cat last.log >&2
              exit 1
            fi
          }

          "$binary" --version

          # init writes a config where there is none, and refuses to overwrite one.
          "$binary" init
          test -f cirrus.yaml
          exits_non_zero "$binary" init

          cat > cirrus.yaml <<'CONFIG'
          commands:
            hello: echo hello-from-cirrus
            deploy:
              description: Ship it.
              run: echo deploying
            boom: "false"

          flows:
            demo:
              steps:
                - command: hello
                - command: deploy
            breaks:
              steps:
                - command: boom
          CONFIG

          # Captured rather than piped into grep: `grep -q` closes the pipe at the first match, and
          # cirrus is still writing - which under `pipefail` fails the step for the wrong reason.
          "$binary" run hello > hello.log 2>&1
          grep -q hello-from-cirrus hello.log

          "$binary" flow demo > flow.log 2>&1
          grep -q deploying flow.log

          # A failure has to reach the shell, not just the person reading the output.
          exits_non_zero "$binary" run boom
          exits_non_zero "$binary" flow breaks
          exits_non_zero "$binary" run no-such-command

          # A project still on 0.2.x is told what to do, rather than that its config is missing.
          mv cirrus.yaml cirrus.toml
          exits_non_zero "$binary" run hello
          grep -q 'reads cirrus.yaml as of 0.3.0' last.log

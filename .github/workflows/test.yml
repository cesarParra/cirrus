name: CI

# Every pull request, and every push to main. A pull request nothing checks before it merges is a
# pull request whose first real test is a release build.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A workflow file that does not parse fails every job on the branch at zero seconds and reports
  # nothing about the code - and nothing local catches it, because the only thing that reads these
  # files is GitHub. Checked first, and in a job of its own, so it answers without a toolchain.
  #
  # Pinned like the SDK: a linter that moves on its own fails a branch nobody touched.
  workflows:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Lint the workflow files
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          # Pinned, not `stable`: `dart format` changes between releases, so a floating SDK fails
          # the formatting check on a branch nobody touched, and passes on a machine that happens
          # to match. Raise it deliberately.
          sdk: 3.13.0

      - name: Install Dart dependencies
        run: dart pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      # --fatal-infos, so the lints in analysis_options.yaml are a gate rather than a suggestion.
      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Run Dart tests
        run: dart test

      # Cirrus ships as a compiled binary, so compiling is part of what a change has to keep
      # working - and nothing above compiles anything.
      - name: Compile the binary
        run: dart compile exe bin/cirrus.dart -o cirrus

      # What the unit tests cannot see. They drive cirrus through a CliRunner double, so nothing
      # above runs the real binary, reads a config file off disk, or observes an exit status -
      # which is most of what a user's first minute consists of.
      - name: Smoke test the binary
        run: |
          set -euo pipefail
          binary="$PWD/cirrus"
          workspace="$(mktemp -d)"
          cd "$workspace"

          # Every assertion goes through these two, for two reasons. `set -e` deliberately ignores
          # a command whose status is inverted, so `! cirrus run boom` passes whatever cirrus does -
          # the exact defect this step exists to catch. And piping into `grep -q` closes the pipe at
          # the first match while cirrus is still writing, which fails the step for the wrong
          # reason - so output is captured and grepped from the file.
          exits_zero() {
            if ! "$@" > last.log 2>&1; then
              echo "Expected '$*' to succeed. It did not." >&2
              cat last.log >&2
              exit 1
            fi
          }

          exits_non_zero() {
            if "$@" > last.log 2>&1; then
              echo "Expected '$*' to exit non-zero. It exited 0." >&2
              cat last.log >&2
              exit 1
            fi
          }

          # The status is a published contract, so the tests that care say which number.
          exits_with() {
            local want="$1"; shift
            set +e
            "$@" > last.log 2>&1
            local got=$?
            set -e
            if [ "$got" -ne "$want" ]; then
              echo "Expected '$*' to exit $want. It exited $got." >&2
              cat last.log >&2
              exit 1
            fi
          }

          exits_zero "$binary" --version

          # init writes a config where there is none, refuses to overwrite one, and writes
          # something cirrus can then read.
          exits_zero "$binary" init
          test -f cirrus.yaml
          exits_non_zero "$binary" init
          # Reads back what init wrote: an empty config is a config with no commands in it, and
          # saying there are none rather than reporting a parse failure is how that shows.
          exits_non_zero "$binary" run anything
          grep -q 'No commands are defined' last.log

          cat > cirrus.yaml <<'CONFIG'
          commands:
            hello: echo hello-from-cirrus
            deploy:
              description: Ship it.
              run: echo deploying
            build: echo building
            check:
              dependsOn: [build, deploy]
            boom: "false"
            three: sh -c "exit 3"
            many: seq 1 200000

          flows:
            demo:
              dependsOn: [build]
              steps:
                - command: deploy
                - command: deploy
            breaks:
              steps:
                - command: boom
          CONFIG

          exits_zero "$binary" run hello
          grep -q hello-from-cirrus last.log

          # A command's prerequisites run when it does. That they run in the right order, and once,
          # is asserted in depends_on_test.dart, where it can be seen.
          exits_zero "$binary" run check
          grep -q building last.log
          grep -q deploying last.log

          # Arguments after `--` reach the command.
          exits_zero "$binary" run hello -- --and-this
          grep -q -- '--and-this' last.log

          # A reader that stops reading ends cirrus the way it ends any tool: quietly, with the
          # status of a writer that took SIGPIPE. `hello` is too small to prove it - its one line
          # fits in the pipe buffer and no write ever fails - so this needs a command that keeps
          # writing after the reader has gone.
          set +e
          "$binary" run many > >(head -1 > /dev/null) 2> pipe.log
          pipe_status=$?
          set -e

          test "$pipe_status" -eq 141
          if grep -q 'Unhandled exception' pipe.log; then
            echo "Expected a closed pipe to end quietly." >&2
            cat pipe.log >&2
            exit 1
          fi

          # A flow's prerequisite runs, and its repeated step repeats.
          exits_zero "$binary" flow demo
          test "$(grep -c building last.log)" -eq 1
          test "$(grep -c deploying last.log)" -eq 2

          # A flow is a sequence, so there is no one step for an argument to belong to.
          exits_non_zero "$binary" flow demo -- --project=chromium

          # A failure has to reach the shell, not just the person reading the output - and which
          # failure it was is the part a build server can act on. `boom` is `false`, so 1 is the
          # command's own answer rather than a number cirrus chose.
          exits_with 1 "$binary" run boom
          exits_with 1 "$binary" flow breaks
          exits_with 2 "$binary" run no-such-command

          # Not 1: a command that chose 3 is answered with 3, through `run` and through a flow.
          exits_with 3 "$binary" run three

          # `run` holds only what the config names, so a command may take any name - including one
          # a built-in used to have. This is the whole CLI failing to build if it ever regresses,
          # which is why it is checked against the real binary rather than only in a unit test.
          cat > cirrus.yaml <<'CONFIG'
          commands:
            create_scratch: echo mine-not-cirrus-own
          CONFIG

          exits_zero "$binary" --version
          exits_zero "$binary" run create_scratch
          grep -q mine-not-cirrus-own last.log

          # A name that could not be typed is refused when the file is read, against the key that
          # has it - not as an argument-parser error naming neither.
          cat > cirrus.yaml <<'CONFIG'
          commands:
            "deploy everything": echo nope
          CONFIG

          exits_non_zero "$binary" run anything
          grep -q 'deploy everything' last.log

          # A key cirrus does not read does nothing, and doing nothing quietly is what a config
          # file cannot afford.
          cat > cirrus.yaml <<'CONFIG'
          orgs:
            dev:
              definitionFile: config/dev.json
              durationDays: 30
          CONFIG

          exits_non_zero "$binary" run anything
          grep -q durationDays last.log

          # Reserved today so it can mean something later without breaking a config that used the
          # characters for their own sake.
          #
          # Written with printf rather than spelled out: the sigil cirrus reserves is also GitHub's
          # own expression syntax, and a workflow file containing it is evaluated here rather than
          # reaching the shell - which is a broken workflow, not a failing test.
          sigil='$'
          printf 'commands:\n  deploy: sf project deploy start --target-org %s{{ steps.org.alias }}\n' \
            "$sigil" > cirrus.yaml

          exits_non_zero "$binary" run anything
          grep -q 'reserves for a future release' last.log

          # Which org to create is one key at the root, so it cannot be claimed twice.
          cat > cirrus.yaml <<'CONFIG'
          defaultOrg: nowhere
          orgs:
            dev:
              definitionFile: config/dev.json
          CONFIG

          exits_non_zero "$binary" run anything
          grep -q nowhere last.log

          # A project still on 0.2.x is told what to do, rather than that its config is missing.
          mv cirrus.yaml cirrus.toml
          exits_non_zero "$binary" run hello
          grep -q 'reads cirrus.yaml as of 0.3.0' last.log

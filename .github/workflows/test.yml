name: CI

# Every pull request, and every push to main. A pull request nothing checks before it merges is a
# pull request whose first real test is a release build.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install Dart dependencies
        run: dart pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      # --fatal-infos, so the lints in analysis_options.yaml are a gate rather than a suggestion.
      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Run Dart tests
        run: dart test

      # Cirrus ships as a compiled binary, so compiling is part of what a change has to keep
      # working - and nothing above compiles anything.
      - name: Compile the binary
        run: dart compile exe bin/cirrus.dart -o cirrus

      # What the unit tests cannot see. They drive cirrus through a CliRunner double, so nothing
      # above runs the real binary, reads a config file off disk, or observes an exit status -
      # which is most of what a user's first minute consists of.
      - name: Smoke test the binary
        run: |
          set -euo pipefail
          binary="$PWD/cirrus"
          workspace="$(mktemp -d)"
          cd "$workspace"

          "$binary" --version

          # init writes a config where there is none.
          "$binary" init
          test -f cirrus.toml

          cat > cirrus.toml <<'CONFIG'
          [commands]
          hello = "echo hello-from-cirrus"
          CONFIG

          "$binary" run hello | grep -q hello-from-cirrus

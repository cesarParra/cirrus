name: CI

# Every pull request, and every push to main. A pull request nothing checks before it merges is a
# pull request whose first real test is a release build.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install Dart dependencies
        run: dart pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      # --fatal-infos, so the lints in analysis_options.yaml are a gate rather than a suggestion.
      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Run Dart tests
        run: dart test

      # Cirrus ships as a compiled binary, so compiling is part of what a change has to keep
      # working - and nothing above compiles anything.
      - name: Compile the binary
        run: dart compile exe bin/cirrus.dart -o cirrus

      # What the unit tests cannot see. They drive cirrus through a CliRunner double, so nothing
      # above runs the real binary, reads a config file off disk, or observes an exit status -
      # which is most of what a user's first minute consists of.
      - name: Smoke test the binary
        run: |
          set -euo pipefail
          binary="$PWD/cirrus"
          workspace="$(mktemp -d)"
          cd "$workspace"

          # Every assertion goes through these two, for two reasons. `set -e` deliberately ignores
          # a command whose status is inverted, so `! cirrus run boom` passes whatever cirrus does -
          # the exact defect this step exists to catch. And piping into `grep -q` closes the pipe at
          # the first match while cirrus is still writing, which fails the step for the wrong
          # reason - so output is captured and grepped from the file.
          exits_zero() {
            if ! "$@" > last.log 2>&1; then
              echo "Expected '$*' to succeed. It did not." >&2
              cat last.log >&2
              exit 1
            fi
          }

          exits_non_zero() {
            if "$@" > last.log 2>&1; then
              echo "Expected '$*' to exit non-zero. It exited 0." >&2
              cat last.log >&2
              exit 1
            fi
          }

          exits_zero "$binary" --version

          # init writes a config where there is none, refuses to overwrite one, and writes
          # something cirrus can then read.
          exits_zero "$binary" init
          test -f cirrus.yaml
          exits_non_zero "$binary" init
          # Reads back what init wrote: an empty config is a config with no commands in it, and
          # reporting the missing command rather than a parse failure is how that shows.
          exits_non_zero "$binary" run anything
          grep -q 'Could not find a subcommand' last.log

          cat > cirrus.yaml <<'CONFIG'
          commands:
            hello: echo hello-from-cirrus
            deploy:
              description: Ship it.
              run: echo deploying
            build: echo building
            check:
              dependsOn: [build, deploy]
            boom: "false"

          flows:
            demo:
              dependsOn: [build]
              steps:
                - command: deploy
                - command: deploy
            breaks:
              steps:
                - command: boom
          CONFIG

          exits_zero "$binary" run hello
          grep -q hello-from-cirrus last.log

          # A command's prerequisites run when it does. That they run in the right order, and once,
          # is asserted in depends_on_test.dart, where it can be seen.
          exits_zero "$binary" run check
          grep -q building last.log
          grep -q deploying last.log

          # Arguments after `--` reach the command.
          exits_zero "$binary" run hello -- --and-this
          grep -q -- '--and-this' last.log

          # A reader that stops reading is not an error: `| head` closes the pipe mid-write.
          "$binary" run hello | head -1 > /dev/null

          # A flow's prerequisite runs, and its repeated step repeats.
          exits_zero "$binary" flow demo
          test "$(grep -c building last.log)" -eq 1
          test "$(grep -c deploying last.log)" -eq 2

          # A failure has to reach the shell, not just the person reading the output.
          exits_non_zero "$binary" run boom
          exits_non_zero "$binary" flow breaks
          exits_non_zero "$binary" run no-such-command

          # A project still on 0.2.x is told what to do, rather than that its config is missing.
          mv cirrus.yaml cirrus.toml
          exits_non_zero "$binary" run hello
          grep -q 'reads cirrus.yaml as of 0.3.0' last.log
